<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Dapur Mulia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="auth-section">
        <div class="auth-card">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none"><h3 class="fw-bold"><span class="text-primary">Dapur</span> Mulia</h3></a>
                <p class="text-muted">Selamat datang kembali</p>
            </div>
            <form onsubmit="event.preventDefault();alert('Login berhasil!');window.location.href='index.html';">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="contoh@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Kata Sandi</label>
                    <input type="password" class="form-control" placeholder="Masukkan kata sandi" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Ingat saya</label>
                    </div>
                    <a href="forgot.html" class="text-primary text-decoration-none small">Lupa kata sandi?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg mb-3"><i class="fas fa-sign-in-alt me-2"></i>Masuk</button>
                <p class="text-center text-muted mb-0">Belum punya akun? <a href="register.html" class="text-primary text-decoration-none fw-bold">Daftar</a></p>
            </form>
            <div class="text-center mt-3">
                <a href="index.html" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Kembali ke Beranda</a>
            </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
