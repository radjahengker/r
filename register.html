<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Dapur Mulia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="auth-section">
        <div class="auth-card">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none"><h3 class="fw-bold"><span class="text-primary">Dapur</span> Mulia</h3></a>
                <p class="text-muted">Buat akun baru untuk mulai berbelanja</p>
            </div>
            <form onsubmit="event.preventDefault();alert('Pendaftaran berhasil! Silakan masuk dengan akun Anda.');window.location.href='login.html';">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Nama Lengkap</label><input type="text" class="form-control" placeholder="Nama Anda" required></div>
                    <div class="col-md-6"><label class="form-label">No. Telepon</label><input type="tel" class="form-control" placeholder="08xxxxxxxxxx"></div>
                    <div class="col-12"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="contoh@email.com" required></div>
                    <div class="col-md-6"><label class="form-label">Kata Sandi</label><input type="password" class="form-control" placeholder="Min. 8 karakter" required></div>
                    <div class="col-md-6"><label class="form-label">Konfirmasi Sandi</label><input type="password" class="form-control" placeholder="Ulangi kata sandi" required></div>
                <div class="form-check mt-3"><input type="checkbox" class="form-check-input" id="terms" required><label class="form-check-label small" for="terms">Saya setuju dengan <a href="#" class="text-primary">Syarat & Ketentuan</a></label></div>
                <button type="submit" class="btn btn-primary w-100 btn-lg mt-3"><i class="fas fa-user-plus me-2"></i>Daftar</button>
                <p class="text-center text-muted mt-3 mb-0">Sudah punya akun? <a href="login.html" class="text-primary text-decoration-none fw-bold">Masuk</a></p>
            </form>
            <div class="text-center mt-3"><a href="index.html" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Kembali ke Beranda</a></div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
