<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Sandi - Dapur Mulia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="auth-section">
        <div class="auth-card">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none"><h3 class="fw-bold"><span class="text-primary">Dapur</span> Mulia</h3></a>
                <p class="text-muted">Masukkan email untuk mereset kata sandi</p>
            </div>
            <form onsubmit="event.preventDefault();alert('Tautan reset kata sandi telah dikirim ke email Anda.');window.location.href='login.html';">
                <div class="mb-4"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="contoh@email.com" required></div>
                <button type="submit" class="btn btn-primary w-100 btn-lg mb-3"><i class="fas fa-paper-plane me-2"></i>Kirim Tautan Reset</button>
                <p class="text-center mb-0"><a href="login.html" class="text-primary text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Kembali ke Masuk</a></p>
            </form>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
